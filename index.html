<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cyber-Sentinel // 3D Command</title>
    <link rel="stylesheet" href="style.css">
    <!-- script.js is an ES module and imports dependencies (three, loaders, gsap, etc.) -->
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="container">
        <!-- Hero Section -->
        <div class="card full">
            <h1>Global Tech Command</h1>
            <p>Your 24/7 support squad. No bots, just real help.</p>
            <div id="robot-status" class="status">SYSTEM // OFFLINE</div>
        </div>
        
        <!-- UI Card -->
        <div class="card" id="support-card">
            <h2>Live Support Feed</h2>
            <p>Drop your tech issue below.</p>
            <div class="input-row">
                <input id="chat-input" type="text" placeholder="Describe your issue..." />
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    
    <!-- Speech Bubble for Robot -->
    <div id="robot-bubble" class="bubble">"Hey, no cap, need some help?"</div>

    <script type="module" src="script.js"></script>
</body>
</html>
